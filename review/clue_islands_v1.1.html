:1.65}.clue-modal details{margin:12px 0;padding:10px;background:#fffdf5;border-radius:10px}.clue-modal summary{cursor:pointer;font-weight:700}.clue-passport-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}.clue-passport-grid button{background:#fffdf5;color:#28483a;border:1px solid #cbd5c9;border-radius:16px;margin:0;padding:10px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:14px}.clue-passport-grid canvas{width:100%;height:auto;max-width:150px}.clue-passport-grid small{font-size:12px}.clue-entry{position:fixed;left:16px;bottom:108px;z-index:21;background:#f6f3e7;color:#245d49;border:1px solid #9bbba8;border-radius:24px;padding:11px 16px;min-height:44px;font:inherit;cursor:pointer;box-shadow:0 3px 15px #1232}.clue-progress{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin:14px 0}.clue-progress span{padding:4px 10px;border-radius:20px;background:#edf1e8}.clue-progress .done{background:#d5e8ce;color:#245d49}.clue-form .clue-error{border-left:4px solid #8a4f1a}.clue-modal-inner .clue-export-status{font-size:13px;color:#4a594b}.clue-form .clue-footnote{font-size:12px;color:#606d63}

<script>
(function () {
  'use strict';
  var islands = JSON.parse(document.getElementById('clueConfig').textContent);
  var records = {}, storageFailed = {}, currentId = null, lastFocus = null, modalMode = null;
  var modal = document.getElementById('clueModal'), modalBody = document.getElementById('clueModalBody');
  var textFields = ['observation', 'verdict', 'reason', 'evidence'];
  var verdicts = {support:'來源支持說法', conflict:'來源有矛盾或不足以支持', unknown:'仍待確認'};
  var maxLength = 240;
  function config(id) { for(var i=0;i<islands.length;i++) if(islands[i].id===id) return islands[i]; return null; }
  function key(id) { return id==='black-bear-center' ? 'oneMore.clue.blackBear.test.v1' : 'oneMore.clue.'+id+'.test.v1'; }
  function clean(raw) {
    var result={v:1};
    if (!raw || raw.v!==1) return result;
    textFields.forEach(function(k){ if(typeof raw[k]==='string') result[k]=raw[k].slice(0,maxLength); });
    result.explored=raw.explored===true; result.kept=raw.kept===true;
    result.at=typeof raw.at==='number' && isFinite(raw.at) && raw.at>0 ? raw.at : null;
    return result;
  }
  islands.forEach(function(c){ try { records[c.id]=clean(JSON.parse(localStorage.getItem(key(c.id)))); } catch(e) { records[c.id]=clean(null); storageFailed[c.id]=true; } });
  function missing(d) {
    var result=[];
    [['observation','01 探索：寫下觀察'],['explored','01 探索：確認已閱讀兩張資料卡'],['verdict','02 查證：選擇判斷'],['reason','02 查證：寫下理由'],['evidence','03 留證：留下來源或證據位置'],['kept','03 留證：勾選留證確認']].forEach(function(p){
      var v=d[p[0]], absent=p[0]==='verdict' ? !Object.prototype.hasOwnProperty.call(verdicts,v) : typeof v==='string' ? !v.trim() : !v;
      if(absent) result.push({id:p[0],label:p[1]});
    });
    return result;
  }
  function complete(id) { return !!records[id].at && missing(records[id]).length===0; }
  function count() { return islands.filter(function(c){return complete(c.id);}).length; }
  function save(id) { try{localStorage.setItem(key(id),JSON.stringify(records[id]));storageFailed[id]=false;}catch(e){storageFailed[id]=true;} updateProgress(); }
  function escapeHtml(value) { return String(value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];}); }
  function updateProgress() {
    document.getElementById('clueEntry').textContent='外圍探索護照 · '+count()+' / 6';
    islands.forEach(function(c){
      var labels=document.querySelectorAll('.pill[data-id="'+c.id+'"]');
      for(var i=0;i<labels.length;i++) { labels[i].setAttribute('aria-label',c.name+'・線索島'+(complete(c.id)?'・已有探索章':'')); }
    });
  }
  function readForm() {
    if(!currentId) return;
    var d=records[currentId];
    textFields.forEach(function(k){var el=document.getElementById('clue-'+k);if(el)d[k]=el.value.slice(0,maxLength);});
    ['explored','kept'].forEach(function(k){var el=document.getElementById('clue-'+k);if(el)d[k]=el.checked;});
  }
  function updateForm() {
    if(!currentId || !document.getElementById('clueGenerate')) return;
    var d=records[currentId], gaps=missing(d), ready=gaps.length===0;
    var button=document.getElementById('clueGenerate'), hint=document.getElementById('clueRequired');
    button.textContent=ready ? (complete(currentId)?'重新開啟我的探索證明':'產生我的島嶼探索證明') : '查看還缺哪一步（'+gaps.length+' 項）';
    hint.textContent=ready?'✓ 三步驟已完成，可以產生探索證明。':'還需要完成：'+gaps.map(function(g){return g.label;}).join('；')+'。點下方按鈕可前往第一個未完成項目。';
    hint.classList.toggle('clue-error',!ready);
    document.getElementById('clueStoreNote').textContent=storageFailed[currentId]?'此裝置無法儲存進度，目前僅保留在這個頁面；請產生證明後匯出 PNG 或截圖。':'紀錄只存於這台裝置；換裝置不會同步。編輯後需再產生一次證明。';
    var steps=[!!(d.explored&&d.observation&&d.observation.trim()),!!(verdicts[d.verdict]&&d.reason&&d.reason.trim()),!!(d.kept&&d.evidence&&d.evidence.trim())];
    document.getElementById('clueSteps').innerHTML=['探索','查證','留證'].map(function(s,i){return '<span class="'+(steps[i]?'done':'')+'">'+(steps[i]?'✓ ':'')+(i+1)+' '+s+'</span>';}).join('');
    updateProgress();
  }
  function mount(c) {
    currentId=c.id;
    var body=document.getElementById('pBody');
    document.getElementById('pTitle').textContent=c.name;
    document.getElementById('pStep').textContent=c.skill+' · 探索練習版';
    body.innerHTML='<div class="clue-form" style="--clue-ink:'+c.ink+'">'+
      '<p class="clue-note">練習版｜下列測試資料卡完全虛構，不是'+escapeHtml(c.name)+'的實際資訊，也不是官方資料摘錄。</p>'+
      '<div id="clueSteps" class="clue-progress" aria-label="本島三步驟進度"></div>'+
      '<h3>'+escapeHtml(c.question)+'</h3><p>練習用來源與理由檢查說法。若 AI 提供建議，由你比對資料並決定判斷；網站不自動判真偽，也不評分。</p>'+
      '<fieldset><legend>01 探索｜'+escapeHtml(c.skill)+'</legend><p><strong>待查證的測試說法</strong><br>'+escapeHtml(c.claim)+'</p>'+
      c.sources.map(function(s){return '<div class="clue-source"><strong>'+escapeHtml(s.label)+'</strong><p>'+escapeHtml(s.text)+'</p></div>';}).join('')+
      '<label>我注意到什麼？<textarea id="clue-observation" maxlength="240" placeholder="'+escapeHtml(c.observe)+'"></textarea></label>'+
      '<label><input id="clue-explored" type="checkbox">我已閱讀兩張測試資料卡</label></fieldset>'+
      '<fieldset><legend>02 查證｜說明你的判斷</legend><label>比對之後，我的判斷<select id="clue-verdict"><option value="">請選擇</option><option value="support">來源支持說法</option><option value="conflict">來源有矛盾或不足以支持</option><option value="unknown">仍待確認</option></select></label>'+
      '<label>理由與尚待確認之處<textarea id="clue-reason" maxlength="240" placeholder="'+escapeHtml(c.reason)+'"></textarea></label><p>「仍待確認」也能完成。重點是說明比對過程，而不是猜答案。</p></fieldset>'+
      '<fieldset><legend>03 留證｜把依據帶走</legend><label>來源／證據位置<textarea id="clue-evidence" maxlength="240" placeholder="例如：本頁'+escapeHtml(c.sources[0].label)+'、'+escapeHtml(c.sources[1].label)+'；指出你使用哪一段。"></textarea></label><label><input id="clue-kept" type="checkbox">我已留下來源與理由，知道這些是測試資料</label></fieldset>'+
      '<p id="clueStoreNote" role="status"></p><p id="clueRequired" class="clue-note" role="status" aria-live="polite"></p>'+
      '<button id="clueGenerate" aria-describedby="clueRequired">產生我的島嶼探索證明</button><button id="cluePassport" class="clue-secondary">查看外圍六島探索護照</button>'+
      '<p class="clue-footnote">探索章獨立記錄，不影響作品旅程章與升島。各欄最多 240 字；不需填姓名、帳號或上傳檔案。</p>'+
      '<details><summary>再往真實世界查一步</summary><p>'+escapeHtml(c.next)+'</p><p>以下是延伸查證入口，需連網；它不是上方虛構資料卡的來源。斷網時，先用本頁資料完成練習，連網後再核對官方資料。</p><p><a href="'+escapeHtml(c.reference.url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(c.reference.label)+' ↗</a></p>'+(c.note?'<p class="clue-note">⚠️'+escapeHtml(c.note)+'</p>':'')+'</details></div>';
    textFields.forEach(function(k){var el=document.getElementById('clue-'+k);el.value=records[c.id][k]||'';function changed(){records[c.id][k]=el.value.slice(0,maxLength);records[c.id].at=null;save(c.id);updateForm();}el.addEventListener('input',changed);el.addEventListener('change',changed);});
    ['explored','kept'].forEach(function(k){var el=document.getElementById('clue-'+k);el.checked=!!records[c.id][k];el.onchange=function(){records[c.id][k]=el.checked;records[c.id].at=null;save(c.id);updateForm();};});
    document.getElementById('clueGenerate').onclick=generate;
    document.getElementById('cluePassport').onclick=showPassport;
    updateForm();
  }
  var originalOpen=openPanel;
  function openTaskPanel(id) { originalOpen(id);var c=config(id);if(c)mount(c);else currentId=null; }
  openPanel=function(id){openTaskPanel(id);if(config(id)&&complete(id))showProof(id);};
  function showModal(title,html,mode) {
    if(!modal.classList.contains('is-open'))lastFocus=document.activeElement;
    modalMode=mode;modalBody.innerHTML='<h2 id="clueModalTitle">'+escapeHtml(title)+'</h2>'+html;
    modal.classList.add('is-open');modal.setAttribute('aria-hidden','false');
    var focus=modalBody.querySelector('button');if(focus)focus.focus({preventScroll:true});modal.scrollTop=0;
  }
  function dismiss(restore) { modal.classList.remove('is-open');modal.setAttribute('aria-hidden','true');modalMode=null;if(restore&&lastFocus&&document.documentElement.contains(lastFocus))lastFocus.focus({preventScroll:true}); }
  function generate() {
    readForm();updateForm();var gaps=missing(records[currentId]);
    if(gaps.length){var el=document.getElementById('clue-'+gaps[0].id);el.scrollIntoView({block:'center',behavior:'auto'});el.focus({preventScroll:true});return;}
    if(!records[currentId].at)records[currentId].at=Date.now();save(currentId);updateForm();showProof(currentId);
  }
  function showPassport() {
    modalBody.style.setProperty('--clue-ink','#245d49');

  function drawStamp(g,c,x,y,r,earned) {
