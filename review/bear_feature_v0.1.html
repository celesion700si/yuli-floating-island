<style>
.bear-form{color:#234f43}.bear-form fieldset{border:1px solid #c5d8cd;border-radius:16px;padding:18px;margin:18px 0}.bear-form legend{font-weight:750}.bear-form label{display:block;font-size:14px;margin:12px 0}.bear-form textarea,.bear-form select{display:block;width:100%;box-sizing:border-box;border:1px solid #9ab3a6;border-radius:9px;background:#fff;padding:10px;color:#243b32;font:inherit;margin-top:6px}.bear-form textarea{min-height:85px;resize:vertical}.bear-form button,.bear-proof button{padding:12px 16px;border-radius:24px;background:#245d49;color:white;font:inherit;margin:6px 4px 6px 0;cursor:pointer}.bear-form button:disabled{opacity:.4;cursor:not-allowed}.bear-note{background:#f4efdb;padding:12px;border-radius:10px;font-size:14px}.bear-proof{position:fixed;inset:0;z-index:1000;background:rgba(12,35,27,.75);overflow:auto;padding:24px;box-sizing:border-box;display:none}.bear-proof.is-open{display:block}.bear-proof-inner{max-width:720px;margin:auto;background:#f6f3e7;padding:20px;border-radius:20px}.bear-proof canvas{display:block;width:auto;max-width:100%;max-height:65vh;height:auto;margin:auto;border-radius:12px;animation:bear-press .45s ease-out}.bear-proof p{color:#245d49;font-size:14px}.bear-proof a{color:#245d49;text-decoration:underline}.bear-entry{position:fixed;left:16px;bottom:108px;z-index:21;background:#f6f3e7;color:#245d49;border:1px solid #9bbba8;border-radius:24px;padding:10px 14px;font:inherit;cursor:pointer}@keyframes bear-press{from{transform:scale(1.06);opacity:.3}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.bear-proof canvas{animation:none}}@media(max-width:600px){.bear-proof{padding:8px}.bear-proof-inner{padding:12px}.bear-entry{font-size:12px;bottom:114px}}
</style>
<button class="bear-entry" id="bearEntry">黑熊探索測試 · 0 / 6</button>
<div class="bear-proof" id="bearProof" role="dialog" aria-modal="true" aria-label="黑熊島嶼探索證明" aria-hidden="true"><div class="bear-proof-inner"><canvas id="bearCanvas" width="1200" height="1600" role="img" aria-label="黑熊探索證明：測試資料練習完成，結論及理由另列於下方"></canvas><p id="bearProofText"></p><p>這是查證流程練習的完成紀錄，並非館方認證或事實核可。</p><button id="bearDownload">儲存印章圖片 PNG</button><button id="bearBack">返回浮空島</button><p id="bearExport" role="status" aria-live="polite"></p></div></div>
<script>
(function(){
'use strict';
var KEY='oneMore.clue.blackBear.test.v1', data={}, memoryOnly=false, lastFocus=null;
var fields=['observation','verdict','reason','evidence'], proof=document.getElementById('bearProof');
try{var raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.v===1){fields.forEach(function(k){if(typeof raw[k]==='string')data[k]=raw[k].slice(0,240);});data.explored=raw.explored===true;data.kept=raw.kept===true;data.at=typeof raw.at==='number'?raw.at:null;}}catch(e){memoryOnly=true;}
function valid(){return data.explored&&data.kept&&fields.every(function(k){return typeof data[k]==='string'&&data[k].trim().length>0;})&&['support','conflict','unknown'].indexOf(data.verdict)>=0;}
function persist(){data.v=1;try{localStorage.setItem(KEY,JSON.stringify(data));memoryOnly=false;}catch(e){memoryOnly=true;}update();}
function update(){var ready=valid(),btn=document.getElementById('bearGenerate'),note=document.getElementById('bearStatus');if(btn)btn.disabled=!ready;if(note)note.textContent=memoryOnly?'目前只能暫存於此頁，請產生證明並截圖保存。':'只存於這台裝置；換裝置不會同步。';document.getElementById('bearEntry').textContent='黑熊探索測試 · '+(ready&&data.at?'1':'0')+' / 6';}
function mount(){
var body=document.getElementById('pBody');
body.innerHTML='<div class="bear-form"><p class="bear-note">測試版｜以下線索為虛構查證練習，不是黑熊教育館的實際資訊。其餘五島尚未開放探索章。</p><p>用來源與理由檢查說法，最後保留自己的判斷。AI 若提供建議，也需要由你核對；此頁不會自動判真偽。</p><fieldset><legend>01 探索</legend><p>測試說法：「測試展板 A 和 B 都寫著：圖案中有三片葉子。」</p><p>測試展板 A：圖案中有三片葉子。<br>測試展板 B：圖案中有兩片葉子。</p><label>我注意到什麼？<textarea id="bear-observation" maxlength="240"></textarea></label><label><input id="bear-explored" type="checkbox"> 我已閱讀兩張測試展板</label></fieldset><fieldset><legend>02 查證</legend><label>比對之後，我的判斷<select id="bear-verdict"><option value="">請選擇</option><option value="support">來源支持說法</option><option value="conflict">來源有矛盾</option><option value="unknown">仍待確認</option></select></label><label>理由與尚待確認之處<textarea id="bear-reason" maxlength="240"></textarea></label><p>沒有標準答案鎖；請說明你如何比對。仍待確認也能完成練習。</p></fieldset><fieldset><legend>03 留證</legend><label>留下來源／證據位置（例如：本頁測試展板 A、B）<textarea id="bear-evidence" maxlength="240"></textarea></label><label><input id="bear-kept" type="checkbox"> 我已留下來源與理由，知道這些是測試資料</label></fieldset><p id="bearStatus" role="status"></p><button id="bearGenerate">產生我的島嶼探索證明</button><p>完成三步驟後啟用。探索章獨立記錄，不影響作品旅程集章與升島。</p></div>';
fields.forEach(function(k){var el=document.getElementById('bear-'+k);el.value=data[k]||'';el.addEventListener('input',function(){data[k]=el.value;data.at=null;persist();});});
['explored','kept'].forEach(function(k){var el=document.getElementById('bear-'+k);el.checked=!!data[k];el.onchange=function(){data[k]=el.checked;data.at=null;persist();};});
document.getElementById('bearGenerate').onclick=generate;update();
}
var originalOpen=openPanel;
openPanel=function(id){originalOpen(id);if(id==='black-bear-center'){document.getElementById('pTitle').textContent='臺灣黑熊教育館';mount();}};
document.getElementById('bearEntry').onclick=function(){openPanel('black-bear-center');document.getElementById('intro').classList.remove('is-open');};
function lines(ctx,text,x,y,maxWidth,lineHeight){var line='';Array.from(text).forEach(function(ch){if(ch==='\n'||ctx.measureText(line+ch).width>maxWidth){ctx.fillText(line,x,y);y+=lineHeight;line=ch==='\n'?'':ch;}else line+=ch;});if(line){ctx.fillText(line,x,y);y+=lineHeight;}return y;}
function draw(){
var c=document.getElementById('bearCanvas'),g=c.getContext('2d');g.font='24px sans-serif';var rows=0;[data.observation,verdictText(),data.reason,data.evidence].forEach(function(t){var line='',n=1;Array.from(t).forEach(function(ch){if(ch==='\n'||g.measureText(line+ch).width>1044){n++;line=ch==='\n'?'':ch;}else line+=ch;});rows+=n;});c.height=Math.max(1600,905+rows*31+4*54+100);g=c.getContext('2d');g.fillStyle='#f6f3e7';g.fillRect(0,0,1200,c.height);g.strokeStyle='#245d49';g.lineWidth=3;g.strokeRect(36,36,1128,c.height-72);g.fillStyle='#245d49';g.textAlign='center';g.font='22px sans-serif';g.fillText('ONE MORE FIELD LAB · TEST EDITION',600,106);g.font='bold 53px sans-serif';g.fillText('臺灣黑熊教育館',600,184);g.font='30px sans-serif';g.fillText('島嶼探索證明',600,244);
g.save();g.translate(600,495);g.rotate(-.065);g.lineWidth=10;g.beginPath();g.arc(0,0,185,0,Math.PI*2);g.stroke();g.lineWidth=2;g.setLineDash([5,8]);g.beginPath();g.arc(0,0,169,0,Math.PI*2);g.stroke();g.setLineDash([]);g.font='bold 28px sans-serif';g.fillText('探索 · 查證 · 留證',0,-115);
// 原創向量黑熊橡皮章，紙色 V 紋與細碎缺墨。
g.beginPath();g.arc(-64,-40,29,0,7);g.arc(64,-40,29,0,7);g.fill();g.beginPath();g.ellipse(0,5,85,77,0,0,7);g.fill();g.fillStyle='#f6f3e7';g.beginPath();g.moveTo(-49,25);g.lineTo(0,61);g.lineTo(49,25);g.lineTo(40,46);g.lineTo(0,78);g.lineTo(-40,46);g.closePath();g.fill();g.beginPath();g.arc(-28,-14,5,0,7);g.arc(28,-14,5,0,7);g.fill();for(var i=0;i<110;i++){var x=Math.sin(i*91.7)*177,y=Math.cos(i*47.3)*177;g.fillRect(x,y,2,3);}g.fillStyle='#245d49';g.font='bold 28px sans-serif';g.fillText('黑熊探索章',0,127);g.restore();
g.font='bold 28px sans-serif';g.fillText('探索 ✓     查證 ✓     留證 ✓',600,735);g.fillStyle='#765b27';g.font='bold 25px sans-serif';g.fillText('測試資料｜練習完成・非館方認證',600,795);g.textAlign='left';g.fillStyle='#245d49';g.font='22px sans-serif';g.fillText('完成時間：'+new Date(data.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})+'（臺灣）',78,851);
var y=905;[['我的觀察',data.observation],['查證結論',verdictText()],['理由',data.reason],['來源／證據',data.evidence]].forEach(function(pair){g.font='bold 25px sans-serif';g.fillText(pair[0],78,y);y+=34;g.font='24px sans-serif';y=lines(g,pair[1],78,y,1044,31)+20;});g.font='21px sans-serif';g.fillText('線索島探索章 · 與作品旅程章分開 · 不觸發升島',78,c.height-80);
}
function verdictText(){return {support:'來源支持說法',conflict:'來源有矛盾',unknown:'仍待確認'}[data.verdict];}
function generate(){if(!valid())return;if(!data.at)data.at=Date.now();persist();draw();lastFocus=document.activeElement;document.getElementById('bearProofText').textContent='我的觀察：'+data.observation+'｜結論：'+verdictText()+'｜理由：'+data.reason+'｜證據：'+data.evidence;document.getElementById('bearExport').textContent='';proof.classList.add('is-open');proof.setAttribute('aria-hidden','false');proof.scrollTop=0;document.getElementById('bearDownload').focus({preventScroll:true});proof.scrollTop=0;}
function dismiss(){proof.classList.remove('is-open');proof.setAttribute('aria-hidden','true');if(lastFocus)lastFocus.focus();}
document.getElementById('bearBack').onclick=function(){dismiss();closePanel();};
proof.addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();dismiss();}if(e.key==='Tab'){var first=document.getElementById('bearDownload'),last=document.getElementById('bearBack');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.getElementById('bearDownload').onclick=function(){try{var url=document.getElementById('bearCanvas').toDataURL('image/png'),a=document.createElement('a');a.href=url;a.download='one_more_black_bear_test.png';document.body.appendChild(a);a.click();a.remove();document.getElementById('bearExport').textContent='已送出 PNG 儲存請求。若裝置未儲存，請直接截圖保留。';}catch(e){document.getElementById('bearExport').textContent='此裝置無法匯出，請直接截圖保留完成卡。';}};
update();
})();
</script>
